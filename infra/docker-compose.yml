services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    container_name: video-minio
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-localminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    ports:
      - "9000:9000" # S3 API
    volumes:
      - minio_data:/data
    restart: unless-stopped

  openmaxio-console:
    build:
      context: ./openmaxio-object-browser
      dockerfile: Dockerfile.local
    container_name: video-openmaxio-console
    environment:
      CONSOLE_MINIO_SERVER: http://minio:9000
      CONSOLE_PBKDF_PASSPHRASE: ${CONSOLE_PBKDF_PASSPHRASE}
      CONSOLE_PBKDF_SALT: ${CONSOLE_PBKDF_SALT}
    ports:
      - "127.0.0.1:9001:9090"
    depends_on:
      minio:
        condition: service_started
      openmaxio-console-init:
        condition: service_completed_successfully
    restart: unless-stopped

  openmaxio-console-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: video-openmaxio-console-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-localminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
      CONSOLE_ADMIN_USER: ${CONSOLE_ADMIN_USER}
      CONSOLE_ADMIN_PASSWORD: ${CONSOLE_ADMIN_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "Waiting for MinIO..."
          sleep 2
        done
        mc admin user add local "$$CONSOLE_ADMIN_USER" "$$CONSOLE_ADMIN_PASSWORD" || true
        cat >/tmp/console-admin-policy.json <<'POLICY'
        {
          "Version": "2012-10-17",
          "Statement": [
            {"Effect": "Allow", "Action": ["admin:*"], "Resource": ["*"]},
            {"Effect": "Allow", "Action": ["s3:*"], "Resource": ["arn:aws:s3:::*"]}
          ]
        }
        POLICY
        mc admin policy create local consoleAdmin /tmp/console-admin-policy.json || true
        mc admin policy attach local consoleAdmin --user "$$CONSOLE_ADMIN_USER" || true
        echo "OpenMaxIO Console admin user initialized."
    restart: "no"

  valkey:
    image: valkey/valkey:8-alpine
    container_name: video-valkey
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    container_name: video-loki
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: video-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  minio_data:
  valkey_data:
  loki_data:
  grafana_data:
